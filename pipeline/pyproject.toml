[project]
name = "churney-pipeline"
version = "0.1.0"
description = "Churney card-data scraping pipeline (docs/04 §9)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.0",
    "pypdf>=6.16.2",
    "pytest>=8.0",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
