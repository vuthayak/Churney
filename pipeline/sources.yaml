# Churney scraper source registry (docs/04 §9.2, §9.5).
# A source may only be scraped when `allowed: true` AND `tos_reviewed_at` is set.
# `fetch_mode: httpx | playwright`.
#
# Compliance note (2026-08-23): the owner delegated automated pre-checks to the
# pipeline agent. For each allowed source we fetched and read robots.txt (card
# pages permitted) and reviewed reachable ToS pages for anti-scraping language.
# Re-verify manually before production/commercial use.

sources:
  amex_ca:
    issuer_slug: amex_ca
    display_name: American Express Canada
    allowed: true
    tos_reviewed_at: 2026-08-23   # human-reviewed by owner before first crawl
    cadence: weekly
    fetch_mode: playwright        # listing + card pages are JS-rendered (SPA)
    entry_urls:
      - https://www.americanexpress.com/en-ca/credit-cards/all-cards/
      - https://www.americanexpress.com/en-ca/credit-cards/all-cards/business/

  td:
    issuer_slug: td
    display_name: TD Canada Trust
    allowed: true
    tos_reviewed_at: 2026-08-23   # robots.txt: Allow: / ; no anti-scraping ToS clause found
    cadence: weekly
    fetch_mode: httpx
    link_pattern: '^/ca/en/personal-banking/products/credit-cards/(?!browse-all|business)([a-z0-9-]+)/([a-z0-9-]+)$'
    entry_urls:
      - https://www.td.com/ca/en/personal-banking/products/credit-cards

  cibc:
