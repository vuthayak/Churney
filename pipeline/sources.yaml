      RETRY OK 2026-08-28: bmo.com reachable via httpx/curl (200, ~0.2–4s/card) with
      sitemap-correct URLs (/bmo-eclipse-visa-infinite/ not /eclipse-visa-infinite/).
      Prior backoff was wrong URL paths plus httpx ReadTimeout on 404s. Playwright
      still fails ERR_HTTP2_PROTOCOL_ERROR. ChurneyBot scrape intermittently fails when
      robots.txt fetch times out (fetcher conservatively disallows all). Card data in
      static HTML (schema.org Product JSON-LD + embedded price/APR JSON). Use curl
      bootstrap or fixture reparse when live scrape fails.

